<!DOCTYPE html>
<html lang="en" data-theme="spacex">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7-Mark Numerical Questions — Step-by-Step Solved</title>
<style>
/* ===== base (structure uses vars only) ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fbody);min-height:100vh;transition:background .3s,color .3s}
header{padding:30px 20px 16px;max-width:1000px;margin:auto;text-align:var(--halign)}
h1{font-size:clamp(21px,3.6vw,33px);font-weight:var(--hweight);font-family:var(--fhead);letter-spacing:var(--hspacing)}
h1 .grad{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin-top:7px;font-size:14px}
.bar{position:sticky;top:0;z-index:50;background:var(--barbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px}
.bar-in{max-width:1000px;margin:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#search{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:11px 16px;color:var(--ink);font-size:15px;outline:none;font-family:var(--fbody)}
#search:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--mut);padding:7px 13px;border-radius:999px;font-size:12.5px;white-space:nowrap;font-family:var(--fbody)}
.chip.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--chipink);border-color:transparent;font-weight:700}
.count{font-size:12.5px;color:var(--mut);margin-left:auto;white-space:nowrap}
.tbtn{cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:700;font-family:var(--fbody)}
main{max-width:1000px;margin:auto;padding:20px}
.mod{margin-bottom:26px}
.mod h2{font-size:15px;text-transform:var(--h2case);letter-spacing:var(--h2spacing);color:var(--acc);margin:18px 0 10px;display:flex;align-items:center;gap:10px;font-family:var(--fhead);font-weight:var(--hweight)}
.mod h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.card:hover{border-color:var(--acc)}
.q{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:15px 16px;user-select:none}
.num{flex:0 0 auto;min-width:36px;height:36px;border-radius:var(--nrad);display:grid;place-items:center;font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--chipink)}
.qt{font-size:15px;line-height:1.45;padding-top:6px;flex:1}
.mkbadge{display:inline-block;margin-top:6px;font-size:11px;color:var(--good);background:var(--goodbg);border:1px solid var(--goodline);padding:3px 9px;border-radius:999px}
.arrow{color:var(--mut);transition:.2s;padding-top:6px}
.card.open .arrow{transform:rotate(180deg)}
.a{max-height:0;overflow:hidden;transition:max-height .35s ease}
.a-in{margin:0 16px 16px 64px;padding:16px 18px;background:var(--panel2);border-left:3px solid var(--acc);border-radius:0 var(--rad) var(--rad) 0;font-size:14px;line-height:1.65;color:var(--ans)}
.a-in p{margin:8px 0}
pre.code{background:var(--codebg);border:1px solid var(--line);border-radius:var(--rad);padding:12px;overflow-x:auto;margin-top:8px;font-family:Consolas,monospace;font-size:12.5px;color:var(--codetx);white-space:pre}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:8px}
.demo{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:18px;box-shadow:var(--shadow)}
.demo h3{font-size:15px;margin-bottom:4px;font-family:var(--fhead)}
.demo p.hint{font-size:12px;color:var(--mut);margin-bottom:12px}
.demo label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
.demo input[type=number],.demo input[type=text],.demo textarea{width:100%;background:var(--codebg);border:1px solid var(--line);border-radius:var(--rad);color:var(--ink);padding:8px 10px;font-size:14px;outline:none;font-family:var(--fbody)}
.demo input:focus,.demo textarea:focus{border-color:var(--acc)}
.out{margin-top:12px;background:var(--codebg);border:1px solid var(--line);border-radius:var(--rad);padding:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;color:var(--ans)}
.big{font-size:26px;font-weight:800;color:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:linear-gradient(90deg,var(--acc),var(--acc2));border:none;color:var(--chipink);padding:8px 14px;border-radius:var(--rad);font-size:13px;cursor:pointer;font-weight:700;font-family:var(--fbody)}
.btn.ghost{background:var(--chip);border:1px solid var(--line);color:var(--mut)}
canvas{width:100%;border-radius:var(--rad);background:var(--codebg);border:1px solid var(--line);cursor:crosshair;touch-action:none}
input[type=range]{width:100%;accent-color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:10px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mut)}
.bfill{width:100%;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.calc{background:var(--codebg);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;margin:10px 0;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;color:var(--codetx);white-space:pre;overflow-x:auto}
.res{margin-top:12px;background:var(--goodbg);border:1px solid var(--goodline);border-radius:var(--rad);padding:11px 14px;font-weight:700;color:var(--good);font-size:14px}
.res::before{content:"✔ FINAL ANSWER — ";opacity:.8;font-weight:600}
.hl{background:var(--hlbg);border-radius:3px;padding:0 2px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:28px 20px}
footer .credit{margin-top:8px;color:var(--ink);font-size:13px;font-family:var(--fhead)}
footer .credit b{color:var(--acc)}
/* ===== THEME 1 : SPACEX (dark, engineering, monochrome) ===== */
[data-theme="spacex"]{
 --bg:#000;--panel:#0c0c0f;--panel2:#131318;--ink:#f5f5f7;--mut:#86868b;
 --line:#1e1e24;--acc:#4d9fff;--acc2:#8ab8ff;--good:#3ddc97;--chip:#111116;--chipink:#fff;
 --glow:rgba(77,159,255,.16);--ans:#d7dae2;--codebg:#08080b;--codetx:#9fe8c4;
 --goodbg:rgba(61,220,151,.07);--goodline:rgba(61,220,151,.35);--hlbg:rgba(77,159,255,.28);
 --barbg:rgba(0,0,0,.9);--shadow:none;
 --fbody:"Helvetica Neue",Arial,sans-serif;--fhead:"Helvetica Neue",Arial,sans-serif;
 --halign:left;--hweight:800;--hspacing:.5px;--h2case:uppercase;--h2spacing:2.5px;
 --rad:6px;--nrad:4px;
}
[data-theme="spacex"] h1{text-transform:uppercase;letter-spacing:1px}
[data-theme="spacex"] .card{border-width:1px}
/* ===== THEME 2 : FAIRY TALE (light, storybook, pastel) ===== */
[data-theme="fairy"]{
 --bg:#fdf4e7;--panel:#fffdf6;--panel2:#fdeef4;--ink:#503a56;--mut:#9a86a3;
 --line:#eeddf0;--acc:#9b6bd8;--acc2:#e88bb4;--good:#3f9d6e;--chip:#f6e9f6;--chipink:#fff;
 --glow:rgba(155,107,216,.15);--ans:#5d4a66;--codebg:#f2fbf4;--codetx:#2e6b4f;
 --goodbg:rgba(63,157,110,.09);--goodline:rgba(63,157,110,.4);--hlbg:rgba(232,139,180,.35);
 --barbg:rgba(253,244,231,.92);--shadow:0 4px 14px rgba(155,107,216,.10);
 --fbody:Georgia,"Palatino Linotype","Book Antiqua",serif;--fhead:Georgia,"Palatino Linotype",serif;
 --halign:center;--hweight:700;--hspacing:.3px;--h2case:none;--h2spacing:.5px;
 --rad:18px;--nrad:12px;
}
[data-theme="fairy"] body{background-image:radial-gradient(900px 400px at 15% 0%,#fdeef4 0%,transparent 60%),radial-gradient(900px 400px at 90% 0%,#efe6fb 0%,transparent 60%)}
[data-theme="fairy"] h1{font-style:italic}
[data-theme="fairy"] .sub::before{content:"❦  ";color:var(--acc2)}
[data-theme="fairy"] .sub::after{content:"  ❦";color:var(--acc2)}
[data-theme="fairy"] .mod h2::before{content:"✦ ";color:var(--acc2)}
[data-theme="fairy"] .num{box-shadow:0 3px 8px rgba(155,107,216,.3)}
[data-theme="fairy"] .tbtn,[data-theme="fairy"] .chip{border-radius:999px}
@media(max-width:600px){.a-in{margin-left:16px}}
</style>
</head>

<script>
(function(){const root=document.documentElement;
function apply(t){root.setAttribute("data-theme",t);try{localStorage.setItem("qtheme",t)}catch(e){}
 document.querySelectorAll(".tbtn").forEach(b=>b.textContent = t==="spacex" ? "🚀 Theme: SpaceX Dark" : "🧚 Theme: Fairy Tale Light");}
let saved="spacex";try{saved=localStorage.getItem("qtheme")||"spacex"}catch(e){}
apply(saved);
document.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{
 apply(root.getAttribute("data-theme")==="spacex"?"fairy":"spacex");});})();
</script>
<script>
const DATA = [{"q": "Perform the spectral (eigen) decomposition of A = [[4, 1], [1, 3]] and interpret the result.", "mk": "Definition (1M) + Eigenvalues (2M) + Eigenvectors (2M) + Verification & Interpretation (2M)", "a": "<p><b>Step 1 — Characteristic equation.</b> For eigenvalues, solve det(A − λI) = 0:</p>\n<div class=\"calc\">A − λI = [4−λ   1  ]\n        [1    3−λ]\ndet(A − λI) = (4−λ)(3−λ) − (1)(1)\n            = 12 − 7λ + λ² − 1\n            = λ² − 7λ + 11 = 0</div>\n<p><b>Step 2 — Eigenvalues.</b> Using λ = [7 ± √(49 − 44)] / 2 = (7 ± √5)/2:</p>\n<div class=\"calc\">λ₁ = (7 + √5)/2 = 7.236/2 ≈ 4.618\nλ₂ = (7 − √5)/2 = 4.764/2 ≈ 2.382\nCheck: λ₁ + λ₂ = 7 = trace(A) ✓   λ₁·λ₂ = 11 = det(A) ✓</div>\n<p><b>Step 3 — Eigenvector for λ₁ = 4.618.</b> Solve (A − λ₁I)v = 0:</p>\n<div class=\"calc\">(4 − 4.618)x + y = 0  →  y = 0.618x\nTake x = 1: v = (1, 0.618),  ||v|| = √(1² + 0.618²) = √1.382 = 1.176\nv₁ = (1/1.176, 0.618/1.176) = (0.851, 0.526)</div>\n<p><b>Step 4 — Eigenvector for λ₂ = 2.382.</b> By orthogonality v₂ ⊥ v₁: v₂ = (−0.526, 0.851).</p>\n<div class=\"calc\">Check: v₁·v₂ = (0.851)(−0.526) + (0.526)(0.851) = 0 ✓</div>\n<p><b>Step 5 — Spectral decomposition A = QΛQᵀ:</b></p>\n<div class=\"calc\">Q = [v₁ v₂] = [ 0.851  −0.526 ]\n              [ 0.526   0.851 ]\nΛ = [4.618   0   ]      A = QΛQᵀ\n    [0     2.382]</div>\n<p><b>Interpretation (2M):</b> A stretches space by factor 4.618 along direction v₁ and by 2.382 along v₂. The eigenvectors are orthogonal because A is symmetric. If A were a covariance matrix, v₁ would be the direction of maximum variance (PC1) with variance 4.618.</p>\n<div class=\"res\">λ₁ ≈ 4.618, λ₂ ≈ 2.382;  v₁ = (0.851, 0.526), v₂ = (−0.526, 0.851);  A = QΛQᵀ ✓</div>"}, {"q": "Compute the SVD manually for A = [[3,1,1],[−1,3,1],[1,1,3]].", "mk": "Step method (1M) + AᵀA (1M) + σ and V (2M) + U (2M) + Final A = UΣVᵀ (1M)", "a": "<p><b>Step 1 — Compute AᵀA</b> (3×3, symmetric PSD):</p>\n<div class=\"calc\">AᵀA = [3 −1  1][3  1  1]   [11  1  5]\n      [1  3  1][−1 3  1] = [ 1 11  7]\n      [1  1  3][ 1 1  3]   [ 5  7 11]</div>\n<p><b>Step 2 — Eigenvalues of AᵀA</b> (solve det(AᵀA − λI) = 0):</p>\n<div class=\"calc\">λ₁ = 20.094,  λ₂ = 10.055,  λ₃ = 2.851   (all ≥ 0 ✓, sum = 24)\nSingular values: σi = √λi\nσ₁ = √20.094 = 4.483,  σ₂ = √10.055 = 3.171,  σ₃ = √2.851 = 1.688\nCheck: σ₁σ₂σ₃ = 24 = |det A| ✓</div>\n<p><b>Step 3 — Right singular vectors V</b> = normalised eigenvectors of AᵀA:</p>\n<div class=\"calc\">v₁ = (−0.441, −0.577, −0.687)ᵀ\nv₂ = ( 0.816, −0.577, −0.039)ᵀ\nv₃ = (−0.374, −0.577,  0.726)ᵀ   (pairwise orthonormal ✓)</div>\n<p><b>Step 4 — Left singular vectors</b> ui = Avi / σi:</p>\n<div class=\"calc\">u₁ = Av₁/σ₁ = (−0.577, −0.441, −0.687)ᵀ\nu₂ = Av₂/σ₂ = ( 0.577, −0.816,  0.039)ᵀ\nu₃ = Av₃/σ₃ = (−0.577, −0.374,  0.726)ᵀ</div>\n<p><b>Step 5 — Assemble A = UΣVᵀ:</b></p>\n<div class=\"calc\">Σ = [4.483   0     0  ]  U = [u₁ u₂ u₃],  V = [v₁ v₂ v₃]\n    [0     3.171   0  ]  A = UΣVᵀ\n    [0       0   1.688]</div>\n<p><b>Result & check:</b> all three σ &gt; 0, so rank(A) = 3 (full rank). (Signs of columns may differ by software.)</p>\n<div class=\"res\">A = UΣVᵀ with σ = 4.483, 3.171, 1.688 · rank 3 ✓</div>"}, {"q": "Illustrate with an example how PCA transforms 2D data into 1D (worked example).", "mk": "Mean centring (1M) + Covariance (2M) + Eigen decomposition (2M) + Projection & variance kept (2M)", "a": "<p><b>Data:</b> (2,3), (3,5), (4,4), (5,7), (6,6)  →  n = 5 points in 2D.</p>\n<p><b>Step 1 — Mean and centring.</b> μ = ((2+3+4+5+6)/5, (3+5+4+7+6)/5) = <b>(4, 5)</b>. Centred points (x−4, y−5): (−2,−2), (−1,0), (0,−1), (1,2), (2,1).</p>\n<p><b>Step 2 — Covariance matrix</b> C = XcᵀXc / (n−1):</p>\n<div class=\"calc\">Σx'² = 4+1+0+1+4 = 10      Σx'y' = 4+0+0+2+2 = 8\nΣy'² = 4+0+1+4+1 = 10\nC = 1/4 [10  8] = [2.5  2.0]\n        [ 8 10]   [2.0  2.5]</div>\n<p><b>Step 3 — Eigenvalues.</b> det(C − λI) = (2.5−λ)² − 4 = 0 → λ = 2.5 ± 2 → <b>λ₁ = 4.5, λ₂ = 0.5</b>. Eigenvector for λ₁: (2.5−4.5)a + 2b = 0 → b = a → PC1 = (1,1)/√2 = <b>(0.707, 0.707)</b>.</p>\n<p><b>Step 4 — Project onto PC1</b> (score = x'·0.707 + y'·0.707):</p>\n<div class=\"calc\">(−2,−2) → −2.83   (−1,0) → −0.71   (0,−1) → −0.71\n(1,2)  →  2.12   (2,1)  →  2.12</div>\n<p><b>Step 5 — Variance retained:</b> 4.5/(4.5+0.5) = <b>90%</b> of total variance kept with ONE number per point.</p>\n<div class=\"res\">2D → 1D scores: {−2.83, −0.71, −0.71, 2.12, 2.12} keeping 90% variance ✓</div>"}, {"q": "Solve the system: x + y + z = 6,  2x − y + 3z = 14,  x + 2y − z = 2.", "mk": "Method (1M) + Elimination steps (4M) + Solution (1M) + Verification (1M)", "a": "<p><b>Step 1 — Eliminate z.</b> From (1): z = 6 − x − y. Substitute into (2) and (3):</p>\n<div class=\"calc\">(2): 2x − y + 3(6 − x − y) = 14 → 2x − y + 18 − 3x − 3y = 14\n                       −x − 4y = −4   …(4)  →  x = 4 − 4y\n(3): x + 2y − (6 − x − y) = 2  →  2x + 3y = 8        …(5)</div>\n<p><b>Step 2 — Solve for y.</b> Put x = 4 − 4y into (5):</p>\n<div class=\"calc\">2(4 − 4y) + 3y = 8 → 8 − 8y + 3y = 8 → −5y = 0 → y = 0\nx = 4 − 4(0) = 4,   z = 6 − 4 − 0 = 2</div>\n<p><b>Step 3 — Verification</b> (substitute back into ALL three equations):</p>\n<div class=\"calc\">(1) 4 + 0 + 2 = 6  ✓     (2) 8 − 0 + 6 = 14 ✓     (3) 4 + 0 − 2 = 2 ✓</div>\n<div class=\"res\">x = 4,  y = 0,  z = 2 — unique solution, system consistent ✓</div>"}, {"q": "Solve: x + y + z = 6,  2x + 2y + 2z = 12,  x − y + z = 2. Comment on the number of solutions.", "mk": "Consistency check (2M) + Reduction (2M) + General solution (2M) + Rank comment (1M)", "a": "<p><b>Step 1 — Check consistency.</b> Equation (2) = 2 × equation (1), so the equations are <b>linearly dependent</b>. Rank of coefficient matrix = 2 &lt; 3 unknowns, but the system is consistent (no contradiction).</p>\n<p><b>Step 2 — Reduce.</b> Use (1) and (3) only. Subtract (3) from (1):</p>\n<div class=\"calc\">(x + y + z) − (x − y + z) = 6 − 2\n2y = 4  →  y = 2</div>\n<p><b>Step 3 — Back-substitute.</b> Put y = 2 into (1): x + 2 + z = 6 → <b>x + z = 4</b>. One equation, two unknowns → one free parameter t:</p>\n<div class=\"calc\">x = t,  y = 2,  z = 4 − t,   t ∈ ℝ\nExamples: t = 1 → (1, 2, 3);  t = 2 → (2, 2, 2);  t = 0 → (0, 2, 4)</div>\n<div class=\"res\">Infinitely many solutions (x, y, z) = (t, 2, 4−t) — rank 2 &lt; 3, consistent system ✓</div>"}, {"q": "A coin is flipped 4 times giving H, H, H, T. (a) Write the likelihood. (b) Find the MLE of P(heads).", "mk": "Likelihood (2M) + Log-likelihood (1M) + Differentiation (2M) + MLE (1M) + Check (1M)", "a": "<p><b>Step 1 — Model.</b> Let p = P(heads). Each flip is Bernoulli: P(H) = p, P(T) = 1 − p.</p>\n<p><b>Step 2 — Likelihood</b> (product over 3 heads, 1 tail):</p>\n<div class=\"calc\">L(p) = p · p · p · (1−p) = p³(1−p)¹</div>\n<p><b>Step 3 — Log-likelihood</b> (log turns products into sums):</p>\n<div class=\"calc\">ln L(p) = 3 ln p + ln(1−p)</div>\n<p><b>Step 4 — Maximise.</b> Set the derivative to zero:</p>\n<div class=\"calc\">d/dp [ln L] = 3/p − 1/(1−p) = 0\n3(1−p) = p  →  3 − 3p = p  →  3 = 4p  →  p̂ = 3/4 = 0.75</div>\n<p><b>Step 5 — Maximum check</b> (second derivative): d²/dp² = −3/p² − 1/(1−p)² &lt; 0 always → maximum confirmed.</p>\n<div class=\"res\">L(p) = p³(1−p);  MLE p̂ = 3/4 = 0.75 (observed proportion of heads) ✓</div>"}, {"q": "For data [5, 8, 6, 10, 11] compute range, variance and standard deviation (population and sample).", "mk": "Range (1M) + Mean (1M) + Deviations (2M) + Variance (2M) + SD (1M)", "a": "<p><b>Step 1 — Range:</b> max − min = 11 − 5 = <b>6</b>.</p>\n<p><b>Step 2 — Mean:</b> x̄ = (5+8+6+10+11)/5 = 40/5 = <b>8</b>.</p>\n<p><b>Step 3 — Squared deviations</b> (x − x̄)²:</p>\n<div class=\"calc\">x:      5    8    6    10   11\nx − x̄: −3    0   −2    2    3\n(x−x̄)²: 9    0    4    4    9   →  Σ = 26</div>\n<p><b>Step 4 — Variance.</b></p>\n<div class=\"calc\">Population: σ² = Σ(x−x̄)²/n = 26/5 = 5.2\nSample (n−1):  s² = 26/4 = 6.5</div>\n<p><b>Step 5 — Standard deviation</b> = √variance:</p>\n<div class=\"calc\">σ = √5.2 = 2.28   (population)      s = √6.5 = 2.55   (sample)</div>\n<div class=\"res\">Range = 6 · σ² = 5.2, σ = 2.28 (pop) · s² = 6.5, s = 2.55 (sample) ✓</div>"}, {"q": "For data [10, 15, 20, 25, 30] compute mean, median and mode.", "mk": "Mean (2M) + Median (2M) + Mode (2M) + Comment (1M)", "a": "<p><b>Step 1 — Mean:</b> x̄ = (10+15+20+25+30)/5 = 100/5 = <b>20</b>.</p>\n<p><b>Step 2 — Median:</b> data already sorted (n = 5, odd) → middle (3rd) value = <b>20</b>.</p>\n<p><b>Step 3 — Mode:</b> each value occurs once → <b>no mode</b> (all values are unique).</p>\n<p><b>Comment:</b> mean = median = 20 suggests a symmetric, evenly spaced (uniform gap of 5) distribution — no skewness.</p>\n<div class=\"res\">Mean = 20, Median = 20, Mode = none ✓</div>"}, {"q": "From a normal population with known variance, a sample 5, 7, 8, 10, 12 is drawn. Find the MLE of μ.", "mk": "Likelihood (2M) + Log-likelihood (1M) + Minimise sum of squares (3M) + Result (1M)", "a": "<p><b>Step 1 — Likelihood</b> (σ² known, so only μ is estimated):</p>\n<div class=\"calc\">L(μ) = ∏ (1/√(2πσ²)) · exp(−(xi−μ)²/2σ²)</div>\n<p><b>Step 2 — Log-likelihood:</b></p>\n<div class=\"calc\">ln L(μ) = const − (1/2σ²)·Σ(xi−μ)²</div>\n<p><b>Step 3 — Maximise ⇔ minimise Σ(xi−μ)².</b> Derivative w.r.t. μ:</p>\n<div class=\"calc\">d/dμ Σ(xi−μ)² = −2Σ(xi−μ) = 0  →  Σxi = nμ  →  μ̂ = Σxi/n = x̄</div>\n<p><b>Step 4 — Substitute data:</b> Σxi = 5+7+8+10+12 = 42, n = 5:</p>\n<div class=\"calc\">μ̂ = 42/5 = 8.4</div>\n<p><b>Check:</b> second derivative 2n &gt; 0 → minimum of sum of squares → maximum of likelihood ✓. The sample mean is an <b>unbiased</b> estimator: E[x̄] = μ.</p>\n<div class=\"res\">MLE of μ is the sample mean: μ̂ = x̄ = 8.4 ✓</div>"}, {"q": "Trials to first success: data [3, 1, 2, 2, 4] from a geometric distribution. (a) Likelihood (b) MLE of p.", "mk": "Geometric pmf (1M) + Likelihood (2M) + Log-likelihood (1M) + Derivative (2M) + p̂ (1M)", "a": "<p><b>Step 1 — Model.</b> Geometric pmf: P(X = x) = (1−p)^(x−1) · p.</p>\n<p><b>Step 2 — Likelihood</b> over n = 5 observations:</p>\n<div class=\"calc\">L(p) = ∏(1−p)^(xi−1) p = p⁵ (1−p)^(Σxi − n)\nΣxi = 3+1+2+2+4 = 12,  Σxi − n = 12 − 5 = 7\nL(p) = p⁵(1−p)⁷</div>\n<p><b>Step 3 — Log-likelihood and derivative:</b></p>\n<div class=\"calc\">ln L = 5 ln p + 7 ln(1−p)\nd/dp = 5/p − 7/(1−p) = 0  →  5(1−p) = 7p  →  5 = 12p</div>\n<p><b>Step 4 — MLE:</b></p>\n<div class=\"calc\">p̂ = 5/12 ≈ 0.417      (equivalently p̂ = n/Σxi = 5/12 = 1/x̄, x̄ = 12/5 = 2.4)</div>\n<div class=\"res\">L(p) = p⁵(1−p)⁷;  MLE p̂ = 5/12 ≈ 0.417 ✓</div>"}, {"q": "Prove that the MLE of the Poisson parameter λ is the sample mean.", "mk": "Poisson pmf (1M) + Likelihood (1M) + Log-likelihood (1M) + First derivative (2M) + Result + 2nd derivative check (2M)", "a": "<p><b>Step 1 — Poisson pmf:</b> P(X = x) = e^(−λ) λˣ / x!.</p>\n<p><b>Step 2 — Likelihood and log-likelihood for n observations:</b></p>\n<div class=\"calc\">L(λ) = ∏ e^(−λ) λ^xi / xi!  =  e^(−nλ) · λ^(Σxi) / ∏xi!\nln L(λ) = −nλ + (Σxi) ln λ − Σ ln(xi!)</div>\n<p><b>Step 3 — First-order condition</b> (set derivative to zero):</p>\n<div class=\"calc\">d/dλ [ln L] = −n + Σxi/λ = 0\nΣxi/λ = n  →  λ̂ = Σxi/n = x̄</div>\n<p><b>Step 4 — Confirm it is a maximum</b> (second derivative):</p>\n<div class=\"calc\">d²/dλ² [ln L] = −Σxi/λ² &lt; 0  for all λ &gt; 0  ⇒  maximum  ∎</div>\n<div class=\"res\">λ̂ = x̄ — the MLE of a Poisson rate equals the sample mean ✓</div>"}, {"q": "A biased coin flipped 8 times gives H, T, H, H, H, T, H, H. (a) likelihood (b) log-likelihood (c) MLE (d) conclusion.", "mk": "Counting (1M) + Likelihood (1M) + Log-L (1M) + Derivative (2M) + p̂ + Conclusion (2M)", "a": "<p><b>Step 1 — Count:</b> Heads = 6, Tails = 2, n = 8.</p>\n<p><b>Step 2 — Likelihood:</b> L(p) = p⁶(1−p)².</p>\n<p><b>Step 3 — Log-likelihood:</b> ln L = 6 ln p + 2 ln(1−p).</p>\n<p><b>Step 4 — Maximise:</b></p>\n<div class=\"calc\">d/dp = 6/p − 2/(1−p) = 0 → 6(1−p) = 2p → 6 = 8p → p̂ = 6/8 = 0.75</div>\n<p><b>Step 5 — Conclusion:</b> The MLE equals the observed proportion of heads (6/8 = 75%). Second derivative −6/p² − 2/(1−p)² &lt; 0 confirms a maximum. So the coin is biased toward heads (p = 0.75 ≠ 0.5).</p>\n<div class=\"res\">p̂ = 0.75 — best estimate of P(heads) is 75%; coin is biased ✓</div>"}, {"q": "In a batch of 20 items, 6 are defective. (a) Write the binomial likelihood. (b) Derive the MLE. (c) Compute p̂.", "mk": "Binomial model (1M) + Likelihood (2M) + Log-L + derivative (2M) + p̂ (2M)", "a": "<p><b>Step 1 — Model.</b> X ~ Binomial(n = 20, p): P(X = x) = C(20,x) pˣ (1−p)^(n−x).</p>\n<p><b>Step 2 — Likelihood</b> with x = 6 defectives:</p>\n<div class=\"calc\">L(p) = C(20,6) · p⁶ · (1−p)¹⁴</div>\n<p><b>Step 3 — Log-likelihood and derivative</b> (C(20,6) is a constant):</p>\n<div class=\"calc\">ln L = ln C(20,6) + 6 ln p + 14 ln(1−p)\nd/dp = 6/p − 14/(1−p) = 0 → 6(1−p) = 14p → 6 = 20p</div>\n<p><b>Step 4 — In general:</b> p̂ = x/n (defectives / batch size).</p>\n<p><b>Step 5 — Substitute:</b> p̂ = 6/20 = <b>0.30</b>.</p>\n<div class=\"res\">L(p) = C(20,6)p⁶(1−p)¹⁴;  p̂ = x/n = 0.30 (30% defective) ✓</div>"}, {"q": "A fair die is rolled once. Find P(even number).", "mk": "Sample space (2M) + Favourable outcomes (2M) + Probability (2M) + Answer (1M)", "a": "<p><b>Step 1 — Sample space:</b> S = {1, 2, 3, 4, 5, 6}, so n(S) = 6 equally likely outcomes.</p>\n<p><b>Step 2 — Favourable event:</b> even number E = {2, 4, 6}, so n(E) = 3.</p>\n<p><b>Step 3 — Classical probability:</b></p>\n<div class=\"calc\">P(E) = n(E)/n(S) = 3/6 = 1/2 = 0.5</div>\n<div class=\"res\">P(even) = 3/6 = 1/2 = 0.5 ✓</div>"}, {"q": "P(A) = 0.3, P(B) = 0.6, P(A∩B) = 0.2. Find P(A∪B).", "mk": "Addition rule (3M) + Substitution (2M) + Result (1M) + Meaning (1M)", "a": "<p><b>Step 1 — Addition rule of probability:</b></p>\n<div class=\"calc\">P(A∪B) = P(A) + P(B) − P(A∩B)</div>\n<p><b>Step 2 — Substitute:</b></p>\n<div class=\"calc\">P(A∪B) = 0.3 + 0.6 − 0.2 = 0.7</div>\n<p><b>Step 3 — Interpretation:</b> 70% chance that A or B (or both) occurs. Note P(A∩B) = 0.2 ≠ P(A)·P(B) = 0.18, so A and B are <b>not independent</b>.</p>\n<div class=\"res\">P(A∪B) = 0.3 + 0.6 − 0.2 = 0.7 ✓</div>"}, {"q": "P(X) = 0.5, P(Y) = 0.4, P(X∩Y) = 0.1. Find P(X∪Y).", "mk": "Rule (2M) + Substitution (2M) + Result (1M) + Independence note (1M)", "a": "<p><b>Step 1 — Addition rule:</b> P(X∪Y) = P(X) + P(Y) − P(X∩Y)</p>\n<p><b>Step 2 — Substitute:</b></p>\n<div class=\"calc\">P(X∪Y) = 0.5 + 0.4 − 0.1 = 0.8</div>\n<p><b>Step 3 — Check:</b> P(X)·P(Y) = 0.5 × 0.4 = 0.2 ≠ 0.1 = P(X∩Y) → X and Y are <b>dependent</b> events.</p>\n<div class=\"res\">P(X∪Y) = 0.8 ✓</div>"}, {"q": "A medical test is 95% accurate; 0.5% of people have the disease. Find P(disease | positive).", "mk": "Bayes setup (2M) + Given values (1M) + Total probability (2M) + Posterior (1M) + Interpretation (1M)", "a": "<p><b>Step 1 — Define events.</b> D = has disease, + = positive test. Given: P(D) = 0.005, P(+|D) = 0.95 (sensitivity), so P(+|¬D) = 0.05 (false positive rate).</p>\n<p><b>Step 2 — Bayes' theorem:</b></p>\n<div class=\"calc\">P(D|+) = P(+|D)·P(D) / P(+)\nP(+) = P(+|D)·P(D) + P(+|¬D)·P(¬D)</div>\n<p><b>Step 3 — Total probability of a positive:</b></p>\n<div class=\"calc\">P(+) = 0.95×0.005 + 0.05×0.995\n     = 0.00475 + 0.04975 = 0.0545</div>\n<p><b>Step 4 — Posterior:</b></p>\n<div class=\"calc\">P(D|+) = 0.00475 / 0.0545 = 0.0872 ≈ 8.7%</div>\n<p><b>Interpretation:</b> despite a 95% accurate test, only ~8.7% of positives are true cases — because the disease is rare, false positives outnumber true positives. This is the <b>base-rate fallacy</b>.</p>\n<div class=\"res\">P(disease | positive) ≈ 8.7% ✓</div>"}, {"q": "COVID test: 98% sensitivity, 2% false-positive rate, 1% prevalence. Find P(COVID | positive).", "mk": "Events & givens (1M) + Bayes formula (2M) + Total prob (2M) + Posterior (1M) + Comment (1M)", "a": "<p><b>Step 1 — Givens:</b> P(C) = 0.01, P(+|C) = 0.98, P(+|¬C) = 0.02, P(¬C) = 0.99.</p>\n<p><b>Step 2 — Total probability of positive:</b></p>\n<div class=\"calc\">P(+) = 0.98×0.01 + 0.02×0.99 = 0.0098 + 0.0198 = 0.0296</div>\n<p><b>Step 3 — Bayes:</b></p>\n<div class=\"calc\">P(C|+) = 0.0098 / 0.0296 = 0.3311 ≈ 33%</div>\n<p><b>Comment:</b> Even with a 98% sensitive test, only 1 in 3 positives is a true case at 1% prevalence — most positives are false. Screening low-prevalence populations needs confirmation tests.</p>\n<div class=\"res\">P(COVID | positive) ≈ 33.1% ✓</div>"}, {"q": "A bag has 3 red and 2 green balls. Two are drawn without replacement. Find P(both red).", "mk": "Multiplication rule (2M) + First draw (1M) + Conditional second (2M) + Result (1M)", "a": "<p><b>Step 1 — Multiplication rule</b> (dependent draws, no replacement):</p>\n<div class=\"calc\">P(R₁ ∩ R₂) = P(R₁) · P(R₂ | R₁)</div>\n<p><b>Step 2 — First draw red:</b> P(R₁) = 3/5.</p>\n<p><b>Step 3 — Second draw red given first was red:</b> 2 reds remain of 4 balls → P(R₂|R₁) = 2/4 = 1/2.</p>\n<p><b>Step 4 — Multiply:</b></p>\n<div class=\"calc\">P(both red) = 3/5 × 2/4 = 6/20 = 3/10 = 0.30</div>\n<div class=\"res\">P(both red) = 3/5 × 2/4 = 0.30 ✓</div>"}, {"q": "Printers P1, P2, P3 print 30%, 45%, 25% of pages with error rates 1%, 2%, 4%. A page has a misprint. Find P(it came from P3).", "mk": "Bayes setup (2M) + Joint table (3M) + Total probability (1M) + Posterior (1M)", "a": "<p><b>Step 1 — Joint probabilities</b> P(Pi) × P(error|Pi):</p>\n<div class=\"calc\">P1: 0.30 × 0.01 = 0.003\nP2: 0.45 × 0.02 = 0.009\nP3: 0.25 × 0.04 = 0.010</div>\n<p><b>Step 2 — Total probability of a misprint:</b></p>\n<div class=\"calc\">P(M) = 0.003 + 0.009 + 0.010 = 0.022</div>\n<p><b>Step 3 — Bayes:</b></p>\n<div class=\"calc\">P(P3|M) = P(M|P3)·P(P3) / P(M) = 0.010/0.022 = 0.4545</div>\n<div class=\"res\">P(printed by P3 | misprint) ≈ 0.4545 (≈ 45%) ✓</div>"}, {"q": "Machines X, Y, Z produce 25%, 50%, 25% of items with defect rates 1%, 2%, 6%. Find P(item made by Z | defective).", "mk": "Setup (2M) + Joint table (3M) + Total prob (1M) + Posterior (1M)", "a": "<div class=\"calc\">X: 0.25 × 0.01 = 0.0025\nY: 0.50 × 0.02 = 0.0100\nZ: 0.25 × 0.06 = 0.0150\nTotal P(D) = 0.0025 + 0.0100 + 0.0150 = 0.0275</div>\n<div class=\"calc\">P(Z|D) = 0.0150 / 0.0275 = 0.5455</div>\n<div class=\"res\">P(Z | defective) ≈ 0.5455 (≈ 55%) ✓</div>"}, {"q": "Suppliers A, B, C deliver 40%, 35%, 25% of parts with defect rates 3%, 2%, 4%. Find P(supplier A | part defective).", "mk": "Setup (2M) + Joint table (3M) + Total prob (1M) + Posterior (1M)", "a": "<div class=\"calc\">A: 0.40 × 0.03 = 0.012\nB: 0.35 × 0.02 = 0.007\nC: 0.25 × 0.04 = 0.010\nTotal P(D) = 0.012 + 0.007 + 0.010 = 0.029</div>\n<div class=\"calc\">P(A|D) = 0.012 / 0.029 = 0.4138</div>\n<div class=\"res\">P(A | defective) ≈ 0.4138 (≈ 41%) ✓</div>"}, {"q": "70% of items are good, 30% defective. A test finds 90% of defectives and flags 5% of good items. Find P(defective | flagged).", "mk": "Events (1M) + Flag prob (3M) + Bayes (2M) + Result (1M)", "a": "<p><b>Step 1 — Total probability of being flagged:</b></p>\n<div class=\"calc\">P(F) = P(F|D)·P(D) + P(F|G)·P(G)\n     = 0.90 × 0.30 + 0.05 × 0.70\n     = 0.270 + 0.035 = 0.305</div>\n<p><b>Step 2 — Bayes:</b></p>\n<div class=\"calc\">P(D|F) = 0.270 / 0.305 = 0.8852 ≈ 88.5%</div>\n<div class=\"res\">P(defective | flagged) ≈ 0.885 ✓</div>"}, {"q": "Two cards are drawn consecutively from a 52-card deck without replacement. Find P(both are red).", "mk": "Setup (2M) + First draw (1M) + Conditional second (2M) + Simplification (1M)", "a": "<p><b>Step 1 — First card red:</b> 26 red of 52 → P(R₁) = 26/52 = 1/2.</p>\n<p><b>Step 2 — Second card red given first red:</b> 25 red remain of 51 → P(R₂|R₁) = 25/51.</p>\n<div class=\"calc\">P(both red) = 26/52 × 25/51 = 650/2652 = 0.2451</div>\n<div class=\"res\">P(two red cards) = 26/52 × 25/51 ≈ 0.2451 ✓</div>"}, {"q": "60% of students passed Math, 50% passed English, 30% passed both. Find P(English | Math).", "mk": "Conditional probability formula (3M) + Substitution (2M) + Result (1M)", "a": "<p><b>Step 1 — Formula:</b> P(E|M) = P(E ∩ M) / P(M)</p>\n<p><b>Step 2 — Substitute</b> P(E∩M) = 0.30, P(M) = 0.60:</p>\n<div class=\"calc\">P(E|M) = 0.30 / 0.60 = 0.5</div>\n<p><b>Interpretation:</b> Half of the students who passed Math also passed English.</p>\n<div class=\"res\">P(English | Math) = 0.5 ✓</div>"}, {"q": "A disease affects 1 in 1000 people. A test is positive 99% of the time if ill and has a 2% false-positive rate. Find P(ill | positive).", "mk": "Givens (1M) + True & false positive masses (3M) + Total prob (1M) + Posterior (1M)", "a": "<div class=\"calc\">P(ill) = 1/1000 = 0.001,  P(+|ill) = 0.99,  P(+|well) = 0.02\nTrue positives : 0.001 × 0.99  = 0.00099\nFalse positives: 0.999 × 0.02  = 0.01998\nP(+) = 0.00099 + 0.01998 = 0.02097</div>\n<div class=\"calc\">P(ill|+) = 0.00099 / 0.02097 = 0.0472 ≈ 4.7%</div>\n<div class=\"res\">P(ill | positive) ≈ 4.7% — most positives are false ✓</div>"}, {"q": "A spam filter: 20% of mail is spam, it detects 90% of spam with a 5% false-flag rate. Find P(spam | flagged).", "mk": "Givens (1M) + Joint masses (3M) + Total prob (1M) + Posterior (2M)", "a": "<div class=\"calc\">Spam flagged : 0.20 × 0.90 = 0.18\nHam flagged   : 0.80 × 0.05 = 0.04\nP(flagged) = 0.18 + 0.04 = 0.22</div>\n<div class=\"calc\">P(spam|flagged) = 0.18 / 0.22 = 0.8182 ≈ 81.8%</div>\n<div class=\"res\">P(spam | flagged) ≈ 0.818 ✓</div>"}, {"q": "X = [1, 2, 3], Y = [2, 4, 5]: compute the covariance. Also find Pearson r for X = [10,20,30,40], Y = [15,25,35,45].", "mk": "Means (1M) + Cross-products (3M) + Covariance (1M) + r (2M)", "a": "<p><b>Part A — Covariance.</b> x̄ = 2, ȳ = 11/3 ≈ 3.667.</p>\n<div class=\"calc\">(x−x̄): −1, 0, 1      (y−ȳ): −1.667, 0.333, 1.333\nProducts: (−1)(−1.667) = 1.667;  (0)(0.333) = 0;  (1)(1.333) = 1.333\nΣ = 3.0\nSample cov = 3/(3−1) = 1.5   (population = 3/3 = 1.0)</div>\n<p><b>Part B — Pearson r.</b> Observe Y = X + 5 exactly: every point lies on a perfect straight line with slope +1.</p>\n<div class=\"calc\">r = Sxy/√(Sxx·Syy) = 1 exactly → r = +1 (perfect positive linear relation)</div>\n<div class=\"res\">Cov = 1.5 (sample);  r = +1 ✓</div>"}, {"q": "X = [2, 4, 6, 8], Y = [10, 9, 7, 5]. Determine whether the correlation is positive or negative and compute r.", "mk": "Means (1M) + Sums of squares & cross-products (4M) + r (1M) + Conclusion (1M)", "a": "<p><b>Step 1 — Means:</b> x̄ = 20/4 = 5, ȳ = 31/4 = 7.75.</p>\n<p><b>Step 2 — Deviations and products:</b></p>\n<div class=\"calc\">x−x̄: −3, −1, 1, 3      y−ȳ: 2.25, 1.25, −0.75, −2.75\nSxy = (−3)(2.25)+(−1)(1.25)+(1)(−0.75)+(3)(−2.75) = −17\nSxx = 9+1+1+9 = 20     Syy = 5.0625+1.5625+0.5625+7.5625 = 14.75</div>\n<p><b>Step 3 — Pearson r:</b></p>\n<div class=\"calc\">r = Sxy/√(Sxx·Syy) = −17/√(20×14.75) = −17/√295 = −17/17.176 = −0.9897 ≈ −0.99</div>\n<p><b>Conclusion:</b> r ≈ −0.99 → very strong <b>negative</b> linear correlation (as X increases, Y decreases almost perfectly).</p>\n<div class=\"res\">r ≈ −0.99 — strong negative correlation ✓</div>"}, {"q": "X = [1, 2, 3], Y = [2, 3, 5]. Fit the least-squares line y = a + bx and predict y at x = 4.", "mk": "Sums (2M) + Slope b (2M) + Intercept a (2M) + Line + Prediction (1M)", "a": "<p><b>Step 1 — Summary sums</b> (n = 3): ΣX = 6, ΣY = 10, ΣXY = 2+6+15 = 23, ΣX² = 1+4+9 = 14.</p>\n<p><b>Step 2 — Slope</b> b = (nΣXY − ΣXΣY)/(nΣX² − (ΣX)²):</p>\n<div class=\"calc\">b = (3×23 − 6×10)/(3×14 − 36) = (69 − 60)/(42 − 36) = 9/6 = 1.5</div>\n<p><b>Step 3 — Intercept</b> a = ȳ − b·x̄, with x̄ = 2, ȳ = 10/3:</p>\n<div class=\"calc\">a = 10/3 − 1.5×2 = 3.333 − 3 = 0.333</div>\n<p><b>Step 4 — Regression line & prediction at x = 4:</b></p>\n<div class=\"calc\">ŷ = 0.333 + 1.5x\nx = 4: ŷ = 0.333 + 6 = 6.33</div>\n<div class=\"res\">ŷ = 0.333 + 1.5X;  prediction at x = 4 → 6.33 ✓</div>"}, {"q": "Study hours (1–5) vs marks (50, 55, 65, 70, 75): find the regression line of marks on hours, r, and predict marks for 6 hours.", "mk": "Sums/means (2M) + b (2M) + a (1M) + r (1M) + Prediction (1M)", "a": "<p><b>Step 1 — Means:</b> x̄ = 15/5 = 3, ȳ = 315/5 = 63. Deviations x−x̄: −2,−1,0,1,2; y−ȳ: −13,−8,2,7,12.</p>\n<div class=\"calc\">Sxy = (−2)(−13)+(−1)(−8)+0+(1)(7)+(2)(12) = 26+8+7+24 = 65\nSxx = 4+1+0+1+4 = 10     Syy = 169+64+4+49+144 = 430</div>\n<p><b>Step 2 — Slope and intercept:</b></p>\n<div class=\"calc\">b = Sxy/Sxx = 65/10 = 6.5\na = ȳ − b·x̄ = 63 − 6.5×3 = 63 − 19.5 = 43.5</div>\n<p><b>Step 3 — Correlation:</b></p>\n<div class=\"calc\">r = 65/√(10×430) = 65/65.57 = 0.991</div>\n<p><b>Step 4 — Prediction for 6 hours:</b> ŷ = 43.5 + 6.5×6 = 43.5 + 39 = 82.5 marks.</p>\n<div class=\"res\">Marks = 43.5 + 6.5·Hours;  r = 0.991;  6 h → 82.5 marks ✓</div>"}, {"q": "Price (₹) vs units sold: (10,100), (12,90), (14,80), (16,70), (18,60). Set up and solve the normal equations and predict sales at ₹15.", "mk": "Normal equations (3M) + Solving for a, b (3M) + Line (1M) + Prediction at 15 (1M)", "a": "<p><b>Step 1 — Summary sums</b> (n = 5): ΣX = 70, ΣY = 400, ΣXY = 5400, ΣX² = 1020.</p>\n<p><b>Step 2 — Normal equations</b> from least squares:</p>\n<div class=\"calc\">ΣY = na + bΣX        →  400 = 5a + 70b    …(1)\nΣXY = aΣX + bΣX²   →  5400 = 70a + 1020b  …(2)</div>\n<p><b>Step 3 — Solve.</b> Multiply (1) by 14: 5600 = 70a + 980b. Subtract from (2):</p>\n<div class=\"calc\">5400 − 5600 = (70a + 1020b) − (70a + 980b)\n−200 = 40b → b = −5\nFrom (1): 5a = 400 − 70(−5) = 750 → a = 150</div>\n<p><b>Step 4 — Line and prediction at ₹15:</b></p>\n<div class=\"calc\">Ŷ = 150 − 5X\nX = 15: Ŷ = 150 − 75 = 75 units</div>\n<div class=\"res\">Ŷ = 150 − 5X;  at ₹15 → 75 units ✓</div>"}, {"q": "Actual Y = [10, 12, 14], predicted Ŷ = [11, 11, 13]. Compute MSE and RMSE.", "mk": "Errors (2M) + Squared errors (2M) + MSE (2M) + RMSE (1M)", "a": "<p><b>Step 1 — Errors</b> e = y − ŷ: 10−11 = −1;  12−11 = +1;  14−13 = +1.</p>\n<p><b>Step 2 — Squared errors:</b> 1, 1, 1 → Σe² = 3.</p>\n<p><b>Step 3 — MSE</b> (mean over n = 3):</p>\n<div class=\"calc\">MSE = Σe²/n = 3/3 = 1</div>\n<p><b>Step 4 — RMSE = √MSE = √1 = 1.</b></p>\n<div class=\"res\">MSE = 1,  RMSE = 1 ✓</div>"}, {"q": "A student studied 4 h and slept 7 h. Using k-NN with k = 3 on the sample points below, classify the student. Points: (4,6)→Fail, (3,6)→Fail, (6,8)→Pass, (8,7)→Pass, (2,5)→Fail, (9,8)→Pass.", "mk": "Distance formula (1M) + All distances (3M) + Choose k=3 (1M) + Majority vote (1M)", "a": "<p><b>Step 1 — Euclidean distances</b> from query q = (4, 7): d = √(Δh² + Δs²)</p>\n<div class=\"calc\">(4,6): √(0²+1²) = 1.00   Fail\n(3,6): √(1+1)  = 1.41   Fail\n(6,8): √(4+1)  = 2.24   Pass\n(2,5): √(4+4)  = 2.83   Fail\n(8,7): √16     = 4.00   Pass\n(9,8): √(25+1) = 5.10   Pass</div>\n<p><b>Step 2 — Sort and take k = 3 nearest:</b> (4,6) Fail 1.00 · (3,6) Fail 1.41 · (6,8) Pass 2.24.</p>\n<p><b>Step 3 — Majority vote:</b> Fail = 2, Pass = 1 → predict <b>Fail</b>. (Student's low sleep &amp; moderate study cluster with failing students.)</p>\n<div class=\"res\">k = 3 neighbours: 2 Fail, 1 Pass → classified Fail ✓</div>"}, {"q": "In PCA on standardised breast-cancer data the explained-variance ratios are 44.27%, 18.97%, 9.39%, 6.60%, 5.50%, 4.20%, 3.02%, 2.20%, 1.80%, 1.30%, … How many components keep 95% variance? Justify with calculations.", "mk": "Cumulative sums (4M) + Threshold crossing (2M) + Conclusion (1M)", "a": "<p><b>Step 1 — Cumulative explained variance:</b></p>\n<div class=\"calc\">PC1: 44.27\nPC2: 44.27 + 18.97 = 63.24\nPC3: + 9.39  = 72.63\nPC4: + 6.60  = 79.23\nPC5: + 5.50  = 84.73\nPC6: + 4.20  = 88.93\nPC7: + 3.02  = 91.95\nPC8: + 2.20  = 94.15\nPC9: + 1.80  = 95.95  ← first time ≥ 95%\nPC10:+ 1.30  = 97.25</div>\n<p><b>Step 2 — Conclusion:</b> 9 components are not enough (94.15% &lt; 95%); <b>10 components</b> keep 95.95% ≥ 95%. Dimensionality drops from 30 features to 10 — a 3× reduction with only ~4% information loss. The remaining 20 PCs carry mostly noise.</p>\n<div class=\"res\">Keep 10 PCs → 95.95% variance retained ✓</div>"}, {"q": "Compute the explained variance ratio of each principal component for the 2D example with eigenvalues 4.5 and 0.5, and state how much variance a 1D projection keeps.", "mk": "Formula (2M) + Total variance (1M) + Ratios (2M) + 1D answer (2M)", "a": "<p><b>Step 1 — Formula:</b> EVR_i = λi / Σλj. Total variance = 4.5 + 0.5 = 5.0.</p>\n<div class=\"calc\">EVR₁ = 4.5/5.0 = 0.90 = 90%\nEVR₂ = 0.5/5.0 = 0.10 = 10%</div>\n<p><b>Step 2 — Projection to 1D</b> (keep PC1 only): retains <b>90%</b> of the total variance. The dropped PC2 contributes only 10%, so little information is lost — 2D data are nearly one-dimensional.</p>\n<div class=\"res\">PC1 = 90%, PC2 = 10% → 1D keeps 90% ✓</div>"}];
let query="", active="ALL";
const app=document.getElementById('app'), chipsEl=document.getElementById('chips');
const TAGS=[["ALL","All ("+DATA.length+")"],["bayes","Bayes / Probability"],["mle","MLE / Estimation"],["reg","Regression / Correlation"],["pca","PCA / SVD / Linear Algebra"],["knn","k-NN / ML"]];
function tagOf(q){q=q.toLowerCase();
 if(/bayes|test|die|bag|deck|card|disease|spam|printer|machine|supplier|penalty|flagged|prevalence|covid/.test(q))return"bayes";
 if(/mle|likelihood|poisson|geometric|binomial|estimat|variance|standard deviation|range|mean, median/.test(q))return"mle";
 if(/regression|correlation|covariance|pearson|marks|units sold|mse|rmse|least-squares|line y/.test(q))return"reg";
 if(/svd|spectral|eigen|pca|principal|solve the system|variance ratio/.test(q))return"pca";
 return"knn";}
function renderChips(){chipsEl.innerHTML=TAGS.map(t=>`<span class="chip ${t[0]===active?'on':''}" data-id="${t[0]}">${t[1]}</span>`).join('');
 chipsEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{active=c.dataset.id;renderChips();render();});}
function hl(t){if(!query)return t;const q=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 return t.replace(new RegExp('('+q+')','gi'),'<span class="hl">$1</span>');}
function render(){
 let shown=0, html='';
 DATA.forEach((it,i)=>{
  if(active!=="ALL"&&tagOf(it.q)!==active)return;
  if(query&&!(it.q+" "+it.a).toLowerCase().includes(query.toLowerCase()))return;
  shown++;
  html+=`<div class="card">
   <div class="q"><span class="num">${i+1}</span>
    <div style="flex:1"><div class="qt">${hl(it.q)}</div><span class="mkbadge">7 marks · ${it.mk}</span></div>
    <span class="arrow">▾</span></div>
   <div class="a"><div class="a-in">${hl(it.a)}</div></div></div>`;
 });
 app.innerHTML=html||`<p style="color:var(--mut);padding:30px;text-align:center">No numericals match.</p>`;
 document.getElementById('count').textContent=shown+" / "+DATA.length+" shown";
 app.querySelectorAll('.q').forEach(q=>q.onclick=()=>{
  const card=q.parentElement,a=card.querySelector('.a');
  const open=card.classList.toggle('open');
  a.style.maxHeight=open?a.scrollHeight+"px":"0";});
}
const s=document.getElementById('search');
s.placeholder="Search "+DATA.length+" numericals… (e.g. “Bayes”, “regression”, “SVD”)";
s.addEventListener('input',e=>{query=e.target.value.trim();render();});
renderChips();render();
</script>
</body>
</html>
